name: Windows native build
# Deliberately manual: a self-hosted Windows runner with the pinned toolchain
# and libmpv SDK must be provisioned by the repository owner. An empty NuGet
# cache requires a .NET SDK and access to a configured package source.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, Windows, X64, iima-msvc-v145]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: true
      - name: Check CMake, Ninja and NuGet
        run: |
          cmake --version
          ninja --version
          Get-Command nuget -CommandType Application -ErrorAction Stop | Out-Null
      - name: Stage runner-managed libmpv SDK
        env:
          IIMA_LIBMPV_SDK: ${{ vars.IIMA_LIBMPV_SDK }}
        run: |
          if (-not $env:IIMA_LIBMPV_SDK) { throw 'Set repository variable IIMA_LIBMPV_SDK to the runner-local SDK directory.' }
          ./scripts/stage-libmpv.ps1 -SdkDirectory $env:IIMA_LIBMPV_SDK
      - name: Build Debug x64
        run: ./scripts/build.ps1 -Configuration Debug -Rebuild
      - name: Build Release x64
        run: ./scripts/build.ps1 -Configuration Release -Rebuild
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IIMA-windows-build-${{ github.run_id }}
          path: .build/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
